<html>

        <title>Documents</title>

    <body>

        <h1>Html Form</h1>
        <form>
        <label for="name" >Name:-</label>
        <input id="name" required placeholder="Enter Your Name." type="text"/><br><br>
        <label for="email" >Email id:-</label>
        <input  id="email" required placeholder="Enter Your Email id." type="email"/><br><br>
        <label for="Address" >Address:-</label>
        <input  id="Address" placeholder="Enter Your Address." type="Add"/><br><br>
       
        <label for="file">Select File:</label><br>
        <input type="file" id="file" name="file"><br><br>
        <label for="date">Select Date:</label><br>
        <input type="date" id="date" name="date"><br><br>
        <button type="submit">Submit</button>
        </form>
    </body>

</html>
